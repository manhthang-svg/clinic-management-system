# Whole system:          docker compose up -d --build   -> http://localhost:8081
# Only the database:     docker compose up -d postgres  (backend/frontend run from the IDE / npm run dev)
# Values come from .env in this folder (copy .env.example). Stop: docker compose down (add --volumes to wipe data).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinic}
      DB_USERNAME: ${POSTGRES_USER:-clinic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      # Required: base64 key of at least 256 bits (openssl rand -base64 32); the backend stops without it.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      # The browser opens the app through the frontend container, over plain HTTP locally.
      APP_FRONTEND_ORIGIN: ${APP_FRONTEND_ORIGIN:-http://localhost:8081}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Administrator}
      # PayOS (UC-71) keys from the PayOS dashboard.
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:8081/payment/result}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:8081/payment/cancel}
      # UC-67 result images; without it uploads answer FILE_STORAGE_NOT_CONFIGURED.
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      INSURANCE_SIMULATOR_RESPONSE_DELAY: ${INSURANCE_SIMULATOR_RESPONSE_DELAY:-0ms}
      SIGNING_SIMULATOR_KEYSTORE_PASSWORD: ${SIGNING_SIMULATOR_KEYSTORE_PASSWORD:-}
      # UC-75 follow-up reminder emails. Default: the local Mailpit below (inbox http://localhost:8025).
      # Real email for free: Gmail App Password (see README), set the MAIL_* values in .env.
      FOLLOW_UP_REMINDER_ENABLED: ${FOLLOW_UP_REMINDER_ENABLED:-true}
      FOLLOW_UP_REMINDER_DAYS_BEFORE: ${FOLLOW_UP_REMINDER_DAYS_BEFORE:-1}
      FOLLOW_UP_REMINDER_CRON: ${FOLLOW_UP_REMINDER_CRON:-0 0 8,14,20 * * *}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      # Files that must survive a container restart live in the clinic_backend_data volume.
      CLINIC_ARCHIVE_ROOT: /app/data/archive
      SIGNING_SIMULATOR_KEYSTORE: /app/data/signing-simulator/simulator.p12
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - clinic_backend_data:/app/data
    restart: unless-stopped

  # UC-75: local SMTP server that catches every email (free, nothing leaves the machine). Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  clinic_postgres_data:
  clinic_backend_data:
