# Development profile: adds the demo master data (docs/demo-master-data.md). Never used in production.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed
    # The seed is V1000; schema migrations added later (V3, V4, ...) must still apply to a dev database.
    out-of-order: true

clinic:
  dev-seed:
    password: ${DEV_SEED_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
