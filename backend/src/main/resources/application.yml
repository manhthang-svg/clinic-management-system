spring:
  application:
    name: clinic-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
    username: ${DB_USERNAME:neondb}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # TBD: the shared database has V42 "reconcile room queue counters" applied (04/11/2026) but its file was
    # never pushed. Ignore that missing version until its author adds the file, then remove this line.
    ignore-migration-patterns: "*:missing"
  # UC-67: one result image per request, at most 10 MB (Cloudinary free plan limit for images).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # UC-75: free SMTP for follow-up reminders. Locally Mailpit (docker compose up -d mailpit, inbox
  # http://localhost:8025); in a deployment Gmail with an App Password: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
  # MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true. MAIL_PASSWORD is a secret, only from env.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  health:
    # The SMTP server is optional (UC-75); it must not mark the application down.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

clinic:
  insurance-simulator:
    response-delay: ${INSURANCE_SIMULATOR_RESPONSE_DELAY:0ms}
  national-prescription-simulator:
    response-delay: ${NATIONAL_PRESCRIPTION_SIMULATOR_RESPONSE_DELAY:0ms}
    timeout: 10s
    # NONE (every send accepted), NO_RESPONSE (UC-90 AF-02) or REJECT (first send of each code rejected, UC-91/92).
    failure-mode: ${NATIONAL_PRESCRIPTION_SIMULATOR_FAILURE_MODE:NONE}
    # Demonstration passwords of the national accounts (QĐ 808 III, VI); empty accepts any non-blank password.
    # One value for the facility and one shared by every Doctor; the clinic never stores either (BR-59-17).
    facility-password: ${NATIONAL_PRESCRIPTION_SIMULATOR_FACILITY_PASSWORD:}
    prescriber-password: ${NATIONAL_PRESCRIPTION_SIMULATOR_PRESCRIBER_PASSWORD:}
  # UC-58 BR-58-06: write-once archive packages of closed medical records (git-ignored by default).
  archive:
    root: ${CLINIC_ARCHIVE_ROOT:.clinic-archive}
  # UC-53: "Sở Y tế" printed on form 15/BV1 (not held by UC-77 yet).
  facility:
    health-department: ${CLINIC_HEALTH_DEPARTMENT:}
  insurance-billing:
    # BR-27: mức lương cơ sở (VND). A visit below 15% of it is covered at 100%.
    base-salary: ${INSURANCE_BASE_SALARY:2530000}
    co-payment-exemption-percent: 15
  security:
    frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
    jwt:
      signing-key: ${JWT_SIGNING_KEY:}
      issuer: ${JWT_ISSUER:clinic-backend}
      audience: ${JWT_AUDIENCE:clinic-web}
      access-token-ttl: 15m
      clock-skew: 30s
    session:
      idle-timeout: 2h
      absolute-lifetime: 12h
      retention-after-end: 30d
      cookie-name: clinic_refresh
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
  follow-up:
    # BR-124: working days after the appointment date during which it can still be linked (Sat/Sun not counted).
    validity-working-days: ${FOLLOW_UP_VALIDITY_WORKING_DAYS:10}
  visit:
    # End-of-day job (BR-22): closes unfinished visits of earlier days; clinic time Asia/Ho_Chi_Minh (Q-32).
    end-of-day:
      enabled: ${VISIT_END_OF_DAY_ENABLED:true}
      cron: ${VISIT_END_OF_DAY_CRON:0 5 0 * * *}
      # Also run once at startup to catch up on a missed run (e.g. a laptop that was off at midnight).
      run-on-startup: ${VISIT_END_OF_DAY_RUN_ON_STARTUP:true}
  # UC-67 result images. CLOUDINARY_URL is a secret (cloudinary://<api_key>:<api_secret>@<cloud_name>), only from env.
  cloudinary:
    url: ${CLOUDINARY_URL:}
    folder: ${CLOUDINARY_FOLDER:clinic/paraclinical}
  mail:
    # UC-75: reminder email of a follow-up appointment, sent once, daysBefore days ahead (clinic time).
    follow-up-reminder:
      enabled: ${FOLLOW_UP_REMINDER_ENABLED:false}
      days-before: ${FOLLOW_UP_REMINDER_DAYS_BEFORE:1}
      cron: ${FOLLOW_UP_REMINDER_CRON:0 0 8,14,20 * * *}
      from: ${MAIL_FROM:${MAIL_USERNAME:}}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrator}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}

  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/result}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
