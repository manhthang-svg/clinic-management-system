<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ứng dụng ký số (giả lập)</title>
<style>
  :root { --bg: #f5f7fa; --card: #fff; --text: #1f2933; --muted: #616e7c; --line: #d9e2ec;
          --primary: #1f6feb; --danger: #c62828; --ok: #2e7d32; --warn-bg: #fff4e5; --warn: #8a5300; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: #102a43; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 18px; }
  .banner { background: var(--warn-bg); color: var(--warn); padding: 8px 16px; font-size: 13px; border-bottom: 1px solid #f0d9b5; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid transparent; font: inherit; cursor: pointer; background: var(--primary); color: #fff; }
  button.secondary { background: #fff; color: var(--text); border-color: var(--line); }
  button.danger { background: var(--danger); }
  button.ok { background: var(--ok); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .request { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
  .request .title { font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .hash { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .tag.revoked { background: #fdecea; color: var(--danger); }
  .tag.active { background: #e8f5e9; color: var(--ok); }
  [role="alert"] { color: var(--danger); margin-top: 8px; min-height: 1em; }
  .status { color: var(--ok); margin-top: 8px; min-height: 1em; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>Ứng dụng ký số (giả lập)</h1></header>
<div class="banner">
  Môi trường giả lập thay cho ứng dụng của CA ký số từ xa. Chứng thư do CA thử nghiệm cấp, chữ ký không có giá trị pháp lý.
</div>
<main>
  <section aria-labelledby="app-title">
    <h2 id="app-title">Xác nhận ký</h2>
    <form id="login" class="row" novalidate>
      <div>
        <label for="serial">Số hiệu chứng thư</label>
        <input id="serial" autocomplete="off" required>
      </div>
      <div>
        <label for="pin">Mã PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
      </div>
      <button id="loginButton" type="submit">Đăng nhập</button>
    </form>
    <div id="loginError" role="alert"></div>
    <div id="requests" aria-live="polite"></div>
  </section>

  <section aria-labelledby="admin-title">
    <h2 id="admin-title">Quản trị CA giả lập</h2>
    <form id="issue" class="row" novalidate>
      <div>
        <label for="username">Tên đăng nhập của bác sĩ</label>
        <input id="username" autocomplete="off" required>
      </div>
      <div>
        <label for="newPin">Mã PIN mới (6 chữ số)</label>
        <input id="newPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" required>
      </div>
      <button type="submit">Cấp chứng thư</button>
    </form>
    <div id="issueError" role="alert"></div>
    <div id="issueStatus" class="status"></div>
    <table aria-label="Chứng thư đã cấp">
      <thead><tr><th>Số hiệu</th><th>Bác sĩ</th><th>Hết hạn</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody id="certificates"></tbody>
    </table>
  </section>
</main>
<script>
  "use strict";
  // Credentials stay in memory only; nothing is written to browser storage.
  let credentials = null;
  let pollTimer = null;
  const base = location.pathname.replace(/\/$/, "") + "/api";
  const errorText = {
    SIGNING_SIMULATOR_CREDENTIALS_INVALID: "Số hiệu chứng thư hoặc mã PIN không đúng.",
    SIGNING_REQUEST_NOT_FOUND: "Yêu cầu ký không còn hiệu lực.",
    ACCOUNT_NOT_FOUND: "Không tìm thấy tài khoản.",
    REQUEST_VALIDATION_FAILED: "Thông tin chưa hợp lệ (tài khoản phải là bác sĩ, mã PIN gồm 6 chữ số).",
    SIGNING_SERVICE_UNAVAILABLE: "Dịch vụ ký số giả lập đang không phản hồi."
  };

  async function call(path, body) {
    const response = await fetch(base + path, {
      method: body === undefined ? "GET" : "POST",
      headers: body === undefined ? {} : { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (response.status === 204) return null;
    const json = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(errorText[json.code] || "Đã xảy ra lỗi. Vui lòng thử lại.");
    return json.data;
  }

  function text(tag, value, className) {
    const element = document.createElement(tag);
    element.textContent = value;
    if (className) element.className = className;
    return element;
  }

  function formatTime(value) {
    return new Date(value).toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" });
  }

  function secondsLeft(value) {
    return Math.max(0, Math.round((new Date(value) - Date.now()) / 1000));
  }

  async function loadRequests() {
    const container = document.getElementById("requests");
    try {
      const requests = await call("/requests/pending", credentials);
      container.replaceChildren();
      if (requests.length === 0) {
        container.append(text("p", "Không có yêu cầu ký nào đang chờ.", "muted"));
        return;
      }
      for (const request of requests) {
        const card = document.createElement("div");
        card.className = "request";
        card.append(text("div", request.title, "title"));
        card.append(text("div", "Gửi lúc " + formatTime(request.requestedAt)
          + " · còn " + secondsLeft(request.expiresAt) + " giây", "muted"));
        card.append(text("div", "SHA-256: " + request.documentSha256, "hash"));
        const actions = document.createElement("div");
        actions.className = "actions";
        const approve = text("button", "Chấp thuận ký", "ok");
        const decline = text("button", "Từ chối", "danger");
        approve.type = decline.type = "button";
        approve.addEventListener("click", () => decide(request.id, "approve", approve, decline));
        decline.addEventListener("click", () => decide(request.id, "decline", approve, decline));
        actions.append(approve, decline);
        card.append(actions);
        container.append(card);
      }
    } catch (error) {
      container.replaceChildren(text("p", error.message, "muted"));
    }
  }

  async function decide(id, action, ...buttons) {
    buttons.forEach(button => { button.disabled = true; });
    try {
      await call("/requests/" + encodeURIComponent(id) + "/" + action, credentials);
    } catch (error) {
      document.getElementById("loginError").textContent = error.message;
    }
    await loadRequests();
  }

  document.getElementById("login").addEventListener("submit", async event => {
    event.preventDefault();
    const alert = document.getElementById("loginError");
    alert.textContent = "";
    const serial = document.getElementById("serial").value.trim();
    const pin = document.getElementById("pin").value;
    if (!serial || !pin) { alert.textContent = "Nhập số hiệu chứng thư và mã PIN."; return; }
    credentials = { serial, pin };
    try {
      await call("/requests/pending", credentials);
      clearInterval(pollTimer);
      await loadRequests();
      pollTimer = setInterval(loadRequests, 2000);
    } catch (error) {
      credentials = null;
      alert.textContent = error.message;
    }
  });

  async function loadCertificates() {
    const body = document.getElementById("certificates");
    try {
      const certificates = await call("/certificates");
      body.replaceChildren();
      for (const certificate of certificates) {
        const row = document.createElement("tr");
        row.append(text("td", certificate.serial, "hash"));
        row.append(text("td", certificate.username));
        row.append(text("td", formatTime(certificate.validTo)));
        const state = document.createElement("td");
        state.append(certificate.revokedAt
          ? text("span", "Đã thu hồi", "tag revoked")
          : text("span", certificate.registered ? "Đang dùng" : "Không dùng", "tag active"));
        row.append(state);
        const actions = document.createElement("td");
        const use = text("button", "Dùng để ký", "secondary");
        use.type = "button";
        use.addEventListener("click", () => {
          document.getElementById("serial").value = certificate.serial;
          document.getElementById("pin").focus();
        });
        actions.append(use);
        if (!certificate.revokedAt) {
          const revoke = text("button", "Thu hồi", "secondary");
          revoke.type = "button";
          revoke.addEventListener("click", async () => {
            await call("/certificates/" + encodeURIComponent(certificate.serial) + "/revoke", {});
            await loadCertificates();
          });
          actions.append(" ", revoke);
        }
        row.append(actions);
        body.append(row);
      }
    } catch (error) {
      body.replaceChildren();
      document.getElementById("issueError").textContent = error.message;
    }
  }

  document.getElementById("issue").addEventListener("submit", async event => {
    event.preventDefault();
    const alert = document.getElementById("issueError");
    const status = document.getElementById("issueStatus");
    alert.textContent = status.textContent = "";
    try {
      const issued = await call("/certificates", {
        username: document.getElementById("username").value.trim(),
        pin: document.getElementById("newPin").value
      });
      status.textContent = "Đã cấp và đăng ký chứng thư " + issued.serial + " cho " + issued.username + ".";
      document.getElementById("newPin").value = "";
      await loadCertificates();
    } catch (error) {
      alert.textContent = error.message;
    }
  });

  loadCertificates();
</script>
</body>
</html>
