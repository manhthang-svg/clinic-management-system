# Operator-only Admin recovery mode defined in docs/security.md. It performs one recovery and exits without opening an HTTP port.
spring:
  main:
    web-application-type: none
    banner-mode: off

# A one-shot maintenance run must not close visits (the end-of-day job also runs at startup).
clinic:
  visit:
    end-of-day:
      enabled: false
  icd10:
    search-cache:
      preload: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
