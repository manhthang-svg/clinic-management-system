server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Result images are up to 10 MB each (UC-67).
    client_max_body_size 20m;

    # API on the same origin, so the refresh-token cookie works without CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built assets have hashed names and can be cached for long.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: every other path loads the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
